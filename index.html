<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">

<title>KEN COMMUNITY • VOTE</title>

<style>

/* =====================================================
   KEN VOTE — ULTRA MOTION
===================================================== */

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

html{
    scroll-behavior:smooth;
}

body{
    min-height:100vh;
    overflow-x:hidden;
    color:#fff;
    font-family:Arial,Tahoma,sans-serif;

    background:
        radial-gradient(circle at 50% 0%,
        rgba(139,92,246,.18),
        transparent 30%),

        radial-gradient(circle at 0% 45%,
        rgba(255,0,55,.12),
        transparent 25%),

        radial-gradient(circle at 100% 65%,
        rgba(90,70,255,.10),
        transparent 25%),

        #030305;
}


/* =====================================================
   MOVING BACKGROUND
===================================================== */

.bg{
    position:fixed;
    inset:0;
    overflow:hidden;
    pointer-events:none;
    z-index:0;
}

.grid{
    position:absolute;
    inset:-50%;
    background-image:
        linear-gradient(
            rgba(255,255,255,.025) 1px,
            transparent 1px
        ),
        linear-gradient(
            90deg,
            rgba(255,255,255,.025) 1px,
            transparent 1px
        );
    background-size:42px 42px;

    transform:
        perspective(600px)
        rotateX(60deg)
        translateY(30%);

    animation:gridMove 12s linear infinite;
}

@keyframes gridMove{

    0%{
        transform:
        perspective(600px)
        rotateX(60deg)
        translateY(0);
    }

    100%{
        transform:
        perspective(600px)
        rotateX(60deg)
        translateY(42px);
    }

}


/* =====================================================
   LIGHT ORBS
===================================================== */

.orb{
    position:absolute;
    border-radius:50%;
    filter:blur(55px);
    opacity:.35;
}

.orb1{
    width:230px;
    height:230px;
    background:#ff1744;
    top:8%;
    left:-90px;
    animation:orb1 8s ease-in-out infinite;
}

.orb2{
    width:260px;
    height:260px;
    background:#7c3aed;
    right:-100px;
    top:20%;
    animation:orb2 10s ease-in-out infinite;
}

.orb3{
    width:180px;
    height:180px;
    background:#304ffe;
    left:25%;
    bottom:-80px;
    animation:orb3 9s ease-in-out infinite;
}

@keyframes orb1{
    0%,100%{
        transform:translate(0,0) scale(1);
    }
    50%{
        transform:translate(100px,80px) scale(1.3);
    }
}

@keyframes orb2{
    0%,100%{
        transform:translate(0,0);
    }
    50%{
        transform:translate(-100px,120px) scale(1.25);
    }
}

@keyframes orb3{
    0%,100%{
        transform:translate(0,0);
    }
    50%{
        transform:translate(100px,-80px) scale(1.3);
    }
}


/* =====================================================
   PARTICLES
===================================================== */

.particles{
    position:absolute;
    inset:0;
}

.p{
    position:absolute;
    width:3px;
    height:3px;
    border-radius:50%;
    background:white;
    box-shadow:
        0 0 8px #fff,
        0 0 18px #8b5cf6;
    animation:particleFloat linear infinite;
}

.p:nth-child(1){left:8%;top:15%;animation-duration:7s}
.p:nth-child(2){left:18%;top:72%;animation-duration:11s}
.p:nth-child(3){left:31%;top:32%;animation-duration:8s}
.p:nth-child(4){left:46%;top:12%;animation-duration:13s}
.p:nth-child(5){left:57%;top:81%;animation-duration:9s}
.p:nth-child(6){left:68%;top:26%;animation-duration:12s}
.p:nth-child(7){left:79%;top:62%;animation-duration:8s}
.p:nth-child(8){left:91%;top:18%;animation-duration:10s}
.p:nth-child(9){left:85%;top:88%;animation-duration:14s}
.p:nth-child(10){left:40%;top:91%;animation-duration:9s}
.p:nth-child(11){left:12%;top:48%;animation-duration:12s}
.p:nth-child(12){left:73%;top:45%;animation-duration:7s}

@keyframes particleFloat{

    0%{
        transform:
        translateY(30px)
        scale(.5);
        opacity:0;
    }

    25%{
        opacity:1;
    }

    75%{
        opacity:.8;
    }

    100%{
        transform:
        translateY(-100px)
        scale(1.4);
        opacity:0;
    }

}


/* =====================================================
   MAIN
===================================================== */

.container{
    position:relative;
    z-index:5;

    width:min(920px,92%);
    margin:auto;

    padding:
        35px 0
        70px;
}


/* =====================================================
   HEADER
===================================================== */

.header{
    text-align:center;
    margin-bottom:30px;
}


/* =====================================================
   KEN LOGO
===================================================== */

.logo-wrap{

    position:relative;

    width:260px;
    height:170px;

    margin:auto;

    display:flex;
    align-items:center;
    justify-content:center;

    direction:ltr;

    animation:
        logoFloat 4s ease-in-out infinite;

}


.logo-wrap::before{

    content:"";

    position:absolute;

    width:150px;
    height:150px;

    border-radius:50%;

    border:
        1px solid
        rgba(139,92,246,.45);

    box-shadow:
        0 0 20px rgba(139,92,246,.2),
        inset 0 0 20px rgba(139,92,246,.1);

    animation:
        ringSpin 7s linear infinite;

}


.logo-wrap::after{

    content:"";

    position:absolute;

    width:190px;
    height:190px;

    border-radius:50%;

    border:
        1px dashed
        rgba(255,23,68,.25);

    animation:
        ringSpinReverse 11s linear infinite;

}


@keyframes logoFloat{

    0%,100%{
        transform:
        translateY(0);
    }

    50%{
        transform:
        translateY(-9px);
    }

}


@keyframes ringSpin{

    from{
        transform:
        rotate(0deg)
        scale(1);
    }

    to{
        transform:
        rotate(360deg)
        scale(1.08);
    }

}


@keyframes ringSpinReverse{

    from{
        transform:
        rotate(360deg);
    }

    to{
        transform:
        rotate(0deg);
    }

}


/* =====================================================
   LOGO LETTERS
===================================================== */

.logo{

    position:relative;

    z-index:3;

    direction:ltr;

    display:flex;

    align-items:center;

    justify-content:center;

    gap:3px;

    font-size:72px;

    font-weight:1000;

    letter-spacing:0;

    line-height:1;

}


.logo span{

    position:relative;

    display:inline-block;

    animation:
        letterFloat 3s ease-in-out infinite,
        letterGlow 2s ease-in-out infinite;

}


.logo .k{

    color:#ff1744;

    text-shadow:
        0 0 5px #ff1744,
        0 0 15px #ff1744,
        0 0 35px #ff1744,
        0 0 70px rgba(255,23,68,.7);

    animation-delay:0s;

}


.logo .e{

    color:#fff;

    text-shadow:
        0 0 5px #fff,
        0 0 15px #fff,
        0 0 35px rgba(255,255,255,.7);

    animation-delay:.15s;

}


.logo .n{

    color:#9b5cff;

    text-shadow:
        0 0 5px #9b5cff,
        0 0 15px #9b5cff,
        0 0 35px #9b5cff,
        0 0 70px rgba(155,92,255,.7);

    animation-delay:.3s;

}


@keyframes letterFloat{

    0%,100%{
        transform:
        translateY(0)
        rotate(0deg);
    }

    25%{
        transform:
        translateY(-5px)
        rotate(-1deg);
    }

    50%{
        transform:
        translateY(2px)
        rotate(1deg);
    }

    75%{
        transform:
        translateY(-3px)
        rotate(0deg);
    }

}


@keyframes letterGlow{

    0%,100%{
        filter:
        brightness(1);
    }

    50%{
        filter:
        brightness(1.45);
    }

}


/* =====================================================
   LOGO SHINE
===================================================== */

.logo::after{

    content:"";

    position:absolute;

    z-index:5;

    width:20px;
    height:110px;

    background:
        linear-gradient(
            90deg,
            transparent,
            rgba(255,255,255,.8),
            transparent
        );

    filter:blur(5px);

    transform:
        skewX(-20deg)
        translateX(-180px);

    animation:
        shine 4s ease-in-out infinite;

}


@keyframes shine{

    0%,45%{
        transform:
        skewX(-20deg)
        translateX(-180px);

        opacity:0;
    }

    55%{
        opacity:1;
    }

    75%,100%{
        transform:
        skewX(-20deg)
        translateX(180px);

        opacity:0;
    }

}


/* =====================================================
   EXTRA LOGO LIGHT
===================================================== */

.logo-light{

    position:absolute;

    width:100%;
    height:100%;

    pointer-events:none;

}


.logo-light i{

    position:absolute;

    width:5px;
    height:5px;

    border-radius:50%;

    background:white;

    box-shadow:
        0 0 8px white,
        0 0 18px #8b5cf6;

    animation:
        spark 2.5s ease-in-out infinite;

}


.logo-light i:nth-child(1){
    left:25%;
    top:35%;
}

.logo-light i:nth-child(2){
    left:72%;
    top:30%;
    animation-delay:.5s;
}

.logo-light i:nth-child(3){
    left:35%;
    top:75%;
    animation-delay:1s;
}

.logo-light i:nth-child(4){
    left:70%;
    top:70%;
    animation-delay:1.5s;
}

@keyframes spark{

    0%,100%{
        transform:
        scale(.3);
        opacity:0;
    }

    40%{
        transform:
        scale(1.5);
        opacity:1;
    }

    60%{
        transform:
        scale(.8);
        opacity:.7;
    }

}


/* =====================================================
   BRAND
===================================================== */

.brand{

    margin-top:-4px;

    color:#8c8c9b;

    font-size:11px;

    letter-spacing:7px;

    animation:
        brandPulse 3s ease-in-out infinite;

}


@keyframes brandPulse{

    0%,100%{
        opacity:.55;
        letter-spacing:7px;
    }

    50%{
        opacity:1;
        letter-spacing:9px;
    }

}


/* =====================================================
   CARD
===================================================== */

.main-card{

    position:relative;

    overflow:hidden;

    padding:35px 22px;

    border-radius:28px;

    border:
        1px solid
        rgba(255,255,255,.08);

    background:
        linear-gradient(
            145deg,
            rgba(255,255,255,.055),
            rgba(255,255,255,.015)
        );

    backdrop-filter:
        blur(20px);

    box-shadow:
        0 30px 100px rgba(0,0,0,.55),
        inset 0 1px 0 rgba(255,255,255,.05);

    animation:
        cardAppear 1s ease both;

}


@keyframes cardAppear{

    from{
        opacity:0;
        transform:
        translateY(25px)
        scale(.97);
    }

    to{
        opacity:1;
        transform:
        translateY(0)
        scale(1);
    }

}


.main-card::before{

    content:"";

    position:absolute;

    width:300px;
    height:300px;

    top:-200px;
    right:-130px;

    border-radius:50%;

    background:#8b5cf6;

    filter:blur(100px);

    opacity:.18;

    animation:
        cardGlow 5s ease-in-out infinite;

}


.main-card::after{

    content:"";

    position:absolute;

    width:260px;
    height:260px;

    bottom:-190px;
    left:-100px;

    border-radius:50%;

    background:#ff1744;

    filter:blur(100px);

    opacity:.14;

    animation:
        cardGlow2 6s ease-in-out infinite;

}


@keyframes cardGlow{

    0%,100%{
        transform:
        scale(1);
    }

    50%{
        transform:
        scale(1.35);
    }

}


@keyframes cardGlow2{

    0%,100%{
        transform:
        scale(1);
    }

    50%{
        transform:
        scale(1.3);
    }

}


.content{
    position:relative;
    z-index:3;
}


/* =====================================================
   BADGE
===================================================== */

.badge{

    width:max-content;

    margin:
        0 auto
        16px;

    padding:
        8px 15px;

    border-radius:50px;

    border:
        1px solid
        rgba(139,92,246,.3);

    background:
        rgba(139,92,246,.08);

    color:#b99cff;

    font-size:11px;

    box-shadow:
        0 0 25px
        rgba(139,92,246,.1);

    animation:
        badgePulse 2.5s ease-in-out infinite;

}


@keyframes badgePulse{

    0%,100%{
        box-shadow:
        0 0 15px
        rgba(139,92,246,.08);
    }

    50%{
        box-shadow:
        0 0 30px
        rgba(139,92,246,.25);
    }

}


/* =====================================================
   TITLE
===================================================== */

h1{

    text-align:center;

    font-size:32px;

    margin-bottom:9px;

    background:
        linear-gradient(
            90deg,
            #fff,
            #cbb8ff,
            #fff
        );

    background-size:200% auto;

    -webkit-background-clip:text;

    background-clip:text;

    color:transparent;

    animation:
        titleShine 4s linear infinite;

}


@keyframes titleShine{

    to{
        background-position:
        200% center;
    }

}


.subtitle{

    text-align:center;

    color:#92929f;

    font-size:14px;

    line-height:1.8;

}


/* =====================================================
   LOGIN
===================================================== */

.login-box{

    max-width:520px;

    margin:
        25px auto 0;

    padding:18px;

    border:
        1px solid
        rgba(255,255,255,.07);

    border-radius:18px;

    background:
        rgba(0,0,0,.18);

}


.login-status{

    margin-bottom:12px;

    text-align:center;

    color:#9999a7;

    font-size:12px;

}


.discord-btn{

    width:100%;

    border:0;

    border-radius:14px;

    padding:15px;

    background:
        linear-gradient(
            135deg,
            #5865f2,
            #4752c4
        );

    color:white;

    font-weight:900;

    font-size:14px;

    cursor:pointer;

    box-shadow:
        0 10px 30px
        rgba(88,101,242,.2);

    transition:
        transform .2s,
        box-shadow .2s,
        filter .2s;

}


.discord-btn:hover{

    transform:
        translateY(-3px);

    box-shadow:
        0 15px 40px
        rgba(88,101,242,.35);

    filter:
        brightness(1.1);

}


.discord-btn:active{

    transform:
        scale(.97);

}


/* =====================================================
   VOTE BUTTON
===================================================== */

.vote-area{

    margin-top:24px;

    text-align:center;

}


.vote-btn{

    position:relative;

    overflow:hidden;

    width:100%;

    max-width:520px;

    border:
        1px solid
        rgba(255,23,68,.4);

    border-radius:16px;

    padding:17px;

    background:
        linear-gradient(
            135deg,
            #ff1744,
            #b0002b
        );

    color:#fff;

    font-size:16px;

    font-weight:900;

    cursor:pointer;

    box-shadow:
        0 12px 35px
        rgba(255,23,68,.2);

    transition:.2s;

}


.vote-btn::before{

    content:"";

    position:absolute;

    top:0;
    left:-100%;

    width:70%;

    height:100%;

    background:
        linear-gradient(
            90deg,
            transparent,
            rgba(255,255,255,.3),
            transparent
        );

    transform:
        skewX(-20deg);

    animation:
        buttonShine 3s infinite;

}


@keyframes buttonShine{

    0%,55%{
        left:-100%;
    }

    75%,100%{
        left:150%;
    }

}


.vote-btn:hover{

    transform:
        translateY(-3px);

    box-shadow:
        0 18px 45px
        rgba(255,23,68,.3);

}


.vote-btn:disabled{

    opacity:.45;

    cursor:not-allowed;

    transform:none;

    box-shadow:none;

}


.message{

    min-height:22px;

    margin-top:10px;

    color:#9d9daa;

    font-size:12px;

}


/* =====================================================
   STATS
===================================================== */

.stats{

    display:grid;

    grid-template-columns:
        repeat(4,1fr);

    gap:10px;

    margin-top:30px;

}


.stat{

    position:relative;

    overflow:hidden;

    padding:18px 8px;

    text-align:center;

    border:
        1px solid
        rgba(255,255,255,.07);

    border-radius:17px;

    background:
        rgba(255,255,255,.025);

    transition:
        transform .25s,
        border-color .25s;

}


.stat:hover{

    transform:
        translateY(-5px);

    border-color:
        rgba(139,92,246,.3);

}


.stat::after{

    content:"";

    position:absolute;

    left:-100%;

    bottom:0;

    width:100%;

    height:1px;

    background:
        linear-gradient(
            90deg,
            transparent,
            #8b5cf6,
            transparent
        );

    animation:
        statLine 3s linear infinite;

}


@keyframes statLine{

    0%{
        left:-100%;
    }

    100%{
        left:100%;
    }

}


.stat-number{

    display:block;

    font-size:24px;

    font-weight:1000;

    margin-bottom:5px;

}


.stat-label{

    color:#777785;

    font-size:10px;

}


/* =====================================================
   PROGRESS
===================================================== */

.progress-wrap{

    margin-top:20px;

}


.progress-top{

    display:flex;

    justify-content:space-between;

    margin-bottom:7px;

    color:#777785;

    font-size:10px;

}


.progress{

    height:7px;

    overflow:hidden;

    border-radius:20px;

    background:#17171f;

}


.progress-bar{

    height:100%;

    width:0%;

    border-radius:20px;

    background:
        linear-gradient(
            90deg,
            #ff1744,
            #8b5cf6
        );

    box-shadow:
        0 0 15px
        rgba(139,92,246,.6);

    transition:
        width .8s ease;

}


/* =====================================================
   VOTERS
===================================================== */

.voters-section{

    margin-top:30px;

}


.section-title{

    display:flex;

    align-items:center;

    gap:8px;

    margin-bottom:12px;

    font-size:14px;

    font-weight:bold;

}


.section-title::before{

    content:"";

    width:4px;

    height:17px;

    border-radius:5px;

    background:
        linear-gradient(
            #ff1744,
            #8b5cf6
        );

    box-shadow:
        0 0 10px
        rgba(139,92,246,.6);

}


.voters{

    display:flex;

    flex-direction:column;

    gap:8px;

}


.voter{

    display:flex;

    align-items:center;

    justify-content:space-between;

    padding:12px 13px;

    border:
        1px solid
        rgba(255,255,255,.06);

    border-radius:13px;

    background:
        rgba(255,255,255,.02);

    animation:
        voterAppear .4s ease both;

}


@keyframes voterAppear{

    from{
        opacity:0;
        transform:
        translateX(15px);
    }

    to{
        opacity:1;
        transform:
        translateX(0);
    }

}


.voter-name{

    display:flex;

    align-items:center;

    gap:9px;

    min-width:0;

}


.avatar{

    width:32px;

    height:32px;

    display:flex;

    align-items:center;

    justify-content:center;

    flex-shrink:0;

    border-radius:50%;

    background:
        linear-gradient(
            135deg,
            #ff1744,
            #8b5cf6
        );

    font-size:12px;

    font-weight:bold;

    box-shadow:
        0 0 15px
        rgba(139,92,246,.2);

}


.name{

    overflow:hidden;

    text-overflow:ellipsis;

    white-space:nowrap;

    font-size:12px;

}


.time{

    color:#656572;

    font-size:9px;

}


/* =====================================================
   FOOTER
===================================================== */

.footer{

    margin-top:26px;

    text-align:center;

    color:#4d4d58;

    font-size:10px;

}


.footer b{
    color:#777785;
}


/* =====================================================
   LOADING
===================================================== */

.loading{

    padding:20px;

    text-align:center;

    color:#666672;

    font-size:11px;

}


/* =====================================================
   MOBILE
===================================================== */

@media(max-width:600px){

    .container{

        width:94%;

        padding-top:18px;

    }


    .logo-wrap{

        width:230px;

        height:150px;

    }


    .logo{

        font-size:64px;

    }


    .logo-wrap::before{

        width:130px;
        height:130px;

    }


    .logo-wrap::after{

        width:165px;
        height:165px;

    }


    .brand{

        font-size:9px;

        letter-spacing:5px;

    }


    .main-card{

        padding:
            28px 14px;

        border-radius:22px;

    }


    h1{

        font-size:27px;

    }


    .stats{

        grid-template-columns:
            repeat(2,1fr);

    }


    .stat{

        padding:15px 6px;

    }


    .stat-number{

        font-size:21px;

    }


}


/* =====================================================
   REDUCED MOTION
===================================================== */

@media(prefers-reduced-motion:reduce){

    *,
    *::before,
    *::after{

        animation-duration:
            0.001ms !important;

        animation-iteration-count:
            1 !important;

        scroll-behavior:
            auto !important;

    }

}

</style>

</head>


<body>

<div class="bg">

    <div class="grid"></div>

    <div class="orb orb1"></div>

    <div class="orb orb2"></div>

    <div class="orb orb3"></div>

    <div class="particles">

        <i class="p"></i>
        <i class="p"></i>
        <i class="p"></i>
        <i class="p"></i>
        <i class="p"></i>
        <i class="p"></i>
        <i class="p"></i>
        <i class="p"></i>
        <i class="p"></i>
        <i class="p"></i>

<script>

/* =====================================================
   KEN API
===================================================== */

const API_URL =
"https://ken-vote-api.1212mm101.workers.dev";


/* =====================================================
   ELEMENTS
===================================================== */

const total =
document.getElementById("total");

const today =
document.getElementById("today");

const week =
document.getElementById("week");

const month =
document.getElementById("month");

const progressBar =
document.getElementById("progressBar");

const progressText =
document.getElementById("progressText");

const voters =
document.getElementById("voters");

const voteBtn =
document.getElementById("voteBtn");

const loginBtn =
document.getElementById("loginBtn");

const loginStatus =
document.getElementById("loginStatus");

const message =
document.getElementById("message");


/* =====================================================
   LOGIN
===================================================== */

function login(){

    window.location.href =
        API_URL + "/oauth/login";

}


/* =====================================================
   TIME
===================================================== */

function timeAgo(timestamp){

    const diff =
        Date.now() -
        Number(timestamp);

    const minutes =
        Math.floor(
            diff / 60000
        );


    if(minutes < 1)
        return "الآن";


    if(minutes < 60)
        return "قبل " +
            minutes +
            " دقيقة";


    const hours =
        Math.floor(
            minutes / 60
        );


    if(hours < 24)
        return "قبل " +
            hours +
            " ساعة";


    const days =
        Math.floor(
            hours / 24
        );


    if(days < 30)
        return "قبل " +
            days +
            " يوم";


    return "منذ فترة";

}


/* =====================================================
   LOAD STATS
===================================================== */

async function loadStats(){

    try{

        const response =
            await fetch(
                API_URL + "/stats",
                {
                    method:"GET",
                    credentials:"include"
                }
            );


        if(!response.ok)
            throw new Error(
                "API error"
            );


        const data =
            await response.json();


        total.textContent =
            data.total || 0;


        today.textContent =
            data.today || 0;


        week.textContent =
            data.week || 0;


        month.textContent =
            data.month || 0;



        /* LOGIN */

        if(data.loggedIn){

            loginStatus.textContent =
                "✓ تم تسجيل الدخول عبر Discord";


            loginBtn.style.display =
                "none";


            if(data.canVote){

                voteBtn.disabled =
                    false;

                message.textContent =
                    "يمكنك التصويت الآن";

            }else{

                voteBtn.disabled =
                    true;

                message.textContent =
                    "✓ أنت مصوّت مسبقًا";

            }

        }else{

            loginStatus.textContent =
                "سجّل الدخول أولاً حتى تتمكن من التصويت";


            loginBtn.style.display =
                "block";


            voteBtn.disabled =
                true;

        }



        /* PROGRESS */

        const max =
            Math.max(
                Number(
                    data.total || 0
                ),
                1
            );


        const percent =
            Math.min(
                (
                    Number(
                        data.today || 0
                    )
                    /
                    max
                )
                *
                100,
                100
            );


        progressBar.style.width =
            percent + "%";


        progressText.textContent =
            Math.round(percent) +
            "%";



        /* VOTERS */

        voters.innerHTML = "";


        if(
            !data.recent ||
            data.recent.length === 0
        ){

            voters.innerHTML =
                '<div class="loading">لا توجد أصوات حتى الآن</div>';

        }else{


            data.recent.forEach(
                (voter,index) => {


                    const row =
                        document.createElement(
                            "div"
                        );


                    row.className =
                        "voter";


                    row.style.animationDelay =
                        (index * .06) +
                        "s";



                    const name =
                        document.createElement(
                            "div"
                        );


                    name.className =
                        "voter-name";



                    const avatar =
                        document.createElement(
                            "div"
                        );


                    avatar.className =
                        "avatar";


                    avatar.textContent =
                        (
                            voter.username ||
                            "?"
                        )
                        .charAt(0)
                        .toUpperCase();



                    const username =
                        document.createElement(
                            "span"
                        );


                    username.className =
                        "name";


                    username.textContent =
                        voter.username ||
                        "Discord User";



                    name.appendChild(
                        avatar
                    );


                    name.appendChild(
                        username
                    );



                    const time =
                        document.createElement(
                            "span"
                        );


                    time.className =
                        "time";


                    time.textContent =
                        timeAgo(
                            voter.created_at
                        );



                    row.appendChild(
                        name
                    );


                    row.appendChild(
                        time
                    );


                    voters.appendChild(
                        row
                    );

                }
            );

        }


    }catch(error){

        console.error(error);


        loginStatus.textContent =
            "تعذر الاتصال بالخادم";


        voters.innerHTML =
            '<div class="loading">تعذر تحميل البيانات</div>';

    }

}


/* =====================================================
   VOTE
===================================================== */

async function vote(){

    voteBtn.disabled =
        true;


    message.textContent =
        "جاري تسجيل صوتك...";


    try{


        const response =
            await fetch(
                API_URL + "/vote",
                {
                    method:"POST",
                    credentials:"include"
                }
            );


        const data =
            await response.json();



        if(response.status === 401){

            window.location.href =
                API_URL + "/oauth/login";

            return;

        }



        if(response.status === 409){

            message.textContent =
                "✓ أنت مصوّت مسبقًا";

            await loadStats();

            return;

        }



        if(!response.ok){

            throw new Error(
                data.error ||
                "Vote failed"
            );

        }



        if(data.success){

            message.textContent =
                "✓ تم تسجيل صوتك بنجاح";

            await loadStats();

        }


    }catch(error){

        console.error(error);


        message.textContent =
            "حدث خطأ، حاول مرة أخرى";


        voteBtn.disabled =
            false;

    }

}


/* =====================================================
   START
===================================================== */

loadStats();


/* تحديث كل 30 ثانية */

setInterval(
    loadStats,
    30000
);

</script>
