<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>KEN COMMUNITY • VOTE</title>

<style>

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

:root{
    --bg:#050509;
    --card:#0c0c12;
    --card2:#11111a;
    --red:#ff1744;
    --purple:#8b5cf6;
    --blue:#5865f2;
    --white:#ffffff;
    --muted:#9696a6;
    --border:rgba(255,255,255,.08);
}

body{
    min-height:100vh;
    font-family:Arial,Tahoma,sans-serif;
    color:var(--white);
    background:
        radial-gradient(circle at 50% -10%,rgba(139,92,246,.20),transparent 35%),
        radial-gradient(circle at 0% 50%,rgba(255,23,68,.10),transparent 30%),
        var(--bg);
    overflow-x:hidden;
}

body::before{
    content:"";
    position:fixed;
    inset:0;
    pointer-events:none;
    background-image:
        linear-gradient(rgba(255,255,255,.015) 1px,transparent 1px),
        linear-gradient(90deg,rgba(255,255,255,.015) 1px,transparent 1px);
    background-size:35px 35px;
    mask-image:linear-gradient(to bottom,black,transparent);
}

.container{
    width:min(920px,92%);
    margin:auto;
    padding:35px 0 50px;
}

/* HEADER */

.header{
    text-align:center;
    margin-bottom:28px;
}

.logo{
    display:flex;
    justify-content:center;
    align-items:center;
    gap:4px;
    font-size:48px;
    font-weight:900;
    letter-spacing:7px;
    text-shadow:0 0 30px rgba(255,255,255,.08);
}

.logo .k{
    color:#ff1744;
}

.logo .e{
    color:#fff;
}

.logo .n{
    color:#9b5cff;
}

.brand{
    margin-top:7px;
    color:#888896;
    font-size:12px;
    letter-spacing:5px;
}

/* MAIN CARD */

.main-card{
    position:relative;
    overflow:hidden;
    background:
        linear-gradient(145deg,
        rgba(255,255,255,.045),
        rgba(255,255,255,.012));
    border:1px solid var(--border);
    border-radius:25px;
    padding:32px 22px;
    box-shadow:
        0 25px 80px rgba(0,0,0,.45),
        inset 0 1px 0 rgba(255,255,255,.04);
}

.main-card::before{
    content:"";
    position:absolute;
    width:250px;
    height:250px;
    top:-150px;
    right:-100px;
    background:var(--purple);
    filter:blur(100px);
    opacity:.16;
}

.main-card::after{
    content:"";
    position:absolute;
    width:220px;
    height:220px;
    bottom:-150px;
    left:-80px;
    background:var(--red);
    filter:blur(100px);
    opacity:.12;
}

.content{
    position:relative;
    z-index:2;
}

.badge{
    width:max-content;
    margin:0 auto 15px;
    padding:7px 14px;
    border:1px solid rgba(139,92,246,.25);
    border-radius:50px;
    background:rgba(139,92,246,.08);
    color:#b99aff;
    font-size:12px;
}

h1{
    text-align:center;
    font-size:32px;
    margin-bottom:10px;
}

.subtitle{
    text-align:center;
    color:var(--muted);
    line-height:1.8;
    font-size:14px;
}

/* LOGIN */

.login-box{
    margin:25px auto 0;
    max-width:500px;
    padding:18px;
    border:1px solid var(--border);
    border-radius:18px;
    background:rgba(0,0,0,.20);
    text-align:center;
}

.login-status{
    color:#aaaab8;
    font-size:13px;
    margin-bottom:12px;
}

.discord-btn{
    width:100%;
    border:0;
    border-radius:13px;
    padding:14px 18px;
    background:var(--blue);
    color:white;
    font-size:15px;
    font-weight:bold;
    cursor:pointer;
    transition:.2s;
}

.discord-btn:hover{
    transform:translateY(-2px);
    filter:brightness(1.08);
}

.discord-btn:active{
    transform:scale(.98);
}

/* VOTE */

.vote-area{
    margin-top:25px;
    text-align:center;
}

.vote-btn{
    width:100%;
    max-width:500px;
    border:1px solid rgba(255,23,68,.35);
    border-radius:16px;
    padding:17px 20px;
    background:
        linear-gradient(135deg,#ff1744,#b3002d);
    color:#fff;
    font-size:17px;
    font-weight:900;
    cursor:pointer;
    box-shadow:
        0 12px 35px rgba(255,23,68,.18);
    transition:.2s;
}

.vote-btn:hover{
    transform:translateY(-2px);
    box-shadow:
        0 16px 40px rgba(255,23,68,.25);
}

.vote-btn:disabled{
    cursor:not-allowed;
    opacity:.55;
    transform:none;
    box-shadow:none;
}

.message{
    min-height:22px;
    margin-top:12px;
    color:#aaaab8;
    font-size:13px;
}

/* STATS */

.stats{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:10px;
    margin-top:30px;
}

.stat{
    background:rgba(255,255,255,.025);
    border:1px solid var(--border);
    border-radius:16px;
    padding:18px 8px;
    text-align:center;
}

.stat-number{
    display:block;
    font-size:24px;
    font-weight:900;
    margin-bottom:6px;
}

.stat-label{
    color:#858593;
    font-size:11px;
}

/* PROGRESS */

.progress-wrap{
    margin-top:20px;
}

.progress-top{
    display:flex;
    justify-content:space-between;
    color:#858593;
    font-size:11px;
    margin-bottom:7px;
}

.progress{
    height:7px;
    overflow:hidden;
    background:#171720;
    border-radius:20px;
}

.progress-bar{
    height:100%;
    width:0%;
    border-radius:20px;
    background:
        linear-gradient(90deg,var(--red),var(--purple));
    transition:width .7s ease;
}

/* VOTERS */

.voters-section{
    margin-top:30px;
}

.section-title{
    display:flex;
    align-items:center;
    gap:8px;
    margin-bottom:12px;
    font-size:15px;
    font-weight:bold;
}

.section-title::before{
    content:"";
    width:4px;
    height:17px;
    border-radius:5px;
    background:linear-gradient(var(--red),var(--purple));
}

.voters{
    display:flex;
    flex-direction:column;
    gap:8px;
}

.voter{
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:13px 14px;
    background:rgba(255,255,255,.025);
    border:1px solid var(--border);
    border-radius:13px;
}

.voter-name{
    display:flex;
    align-items:center;
    gap:9px;
    min-width:0;
}

.avatar{
    width:32px;
    height:32px;
    display:flex;
    align-items:center;
    justify-content:center;
    flex-shrink:0;
    border-radius:50%;
    background:linear-gradient(135deg,#ff1744,#8b5cf6);
    font-size:12px;
    font-weight:bold;
}

.name{
    overflow:hidden;
    text-overflow:ellipsis;
    white-space:nowrap;
    font-size:13px;
}

.time{
    color:#777785;
    font-size:10px;
}

/* FOOTER */

.footer{
    text-align:center;
    color:#555562;
    font-size:11px;
    margin-top:25px;
}

.footer b{
    color:#777785;
}

/* LOADING */

.loading{
    text-align:center;
    padding:20px;
    color:#777785;
    font-size:12px;
}

/* MOBILE */

@media(max-width:600px){

    .container{
        width:94%;
        padding-top:22px;
    }

    .logo{
        font-size:40px;
        letter-spacing:5px;
    }

    h1{
        font-size:26px;
    }

    .main-card{
        padding:25px 15px;
        border-radius:21px;
    }

    .stats{
        grid-template-columns:repeat(2,1fr);
    }

    .stat{
        padding:15px 6px;
    }

    .stat-number{
        font-size:22px;
    }

    .voter{
        padding:11px;
    }

}

</style>
</head>

<body>

<div class="container">

    <header class="header">

        <div class="logo">
            <span class="k">K</span>
            <span class="e">E</span>
            <span class="n">N</span>
        </div>

        <div class="brand">
            KEN COMMUNITY
        </div>

    </header>


    <main class="main-card">

        <div class="content">

            <div class="badge">
                ✦ KEN COMMUNITY VOTE
            </div>

            <h1>
                صوّت لـ KEN
            </h1>

            <p class="subtitle">
                سجّل دخولك بحساب Discord
                وصوّت مرة واحدة فقط.
            </p>


            <div class="login-box">

                <div
                    class="login-status"
                    id="loginStatus">
                    جاري التحقق من تسجيل الدخول...
                </div>

                <button
                    class="discord-btn"
                    id="loginBtn"
                    onclick="login()">

                    تسجيل الدخول عبر Discord

                </button>

            </div>


            <div class="vote-area">

                <button
                    class="vote-btn"
                    id="voteBtn"
                    onclick="vote()"
                    disabled>

                    🗳️ صوّت لـ KEN

                </button>

                <div
                    class="message"
                    id="message">
                </div>

            </div>


            <div class="stats">

                <div class="stat">
                    <span
                        class="stat-number"
                        id="total">
                        0
                    </span>

                    <span class="stat-label">
                        إجمالي الأصوات
                    </span>
                </div>


                <div class="stat">
                    <span
                        class="stat-number"
                        id="today">
                        0
                    </span>

                    <span class="stat-label">
                        اليوم
                    </span>
                </div>


                <div class="stat">
                    <span
                        class="stat-number"
                        id="week">
                        0
                    </span>

                    <span class="stat-label">
                        هذا الأسبوع
                    </span>
                </div>


                <div class="stat">
                    <span
                        class="stat-number"
                        id="month">
                        0
                    </span>

                    <span class="stat-label">
                        هذا الشهر
                    </span>
                </div>

            </div>


            <div class="progress-wrap">

                <div class="progress-top">

                    <span>
                        تقدم التصويت
                    </span>

                    <span id="progressText">
                        0%
                    </span>

                </div>

                <div class="progress">

                    <div
                        class="progress-bar"
                        id="progressBar">
                    </div>

                </div>

            </div>


            <section class="voters-section">

                <div class="section-title">
                    آخر المصوتين
                </div>

                <div
                    class="voters"
                    id="voters">

                    <div class="loading">
                        جاري تحميل المصوتين...
                    </div>

                </div>

            </section>


            <div class="footer">
                KEN COMMUNITY • نظام التصويت
            </div>

        </div>

    </main>

</div>


<script>

/* ==============================
   KEN VOTE API
============================== */

const API_URL =
"https://ken-vote-api.1212mm101.workers.dev";


/* ==============================
   ELEMENTS
============================== */

const total =
document.getElementById("total");

const today =
document.getElementById("today");

const week =
document.getElementById("week");

const month =
document.getElementById("month");

const progressBar =
document.getElementById("progressBar");

const progressText =
document.getElementById("progressText");

const voters =
document.getElementById("voters");

const voteBtn =
document.getElementById("voteBtn");

const loginBtn =
document.getElementById("loginBtn");

const loginStatus =
document.getElementById("loginStatus");

const message =
document.getElementById("message");


/* ==============================
   LOGIN
============================== */

function login(){

    window.location.href =
        API_URL + "/oauth/login";

}


/* ==============================
   TIME
============================== */

function timeAgo(timestamp){

    const diff =
        Date.now() - Number(timestamp);

    const minutes =
        Math.floor(diff / 60000);

    if(minutes < 1)
        return "الآن";

    if(minutes < 60)
        return "قبل " + minutes + " دقيقة";

    const hours =
        Math.floor(minutes / 60);

    if(hours < 24)
        return "قبل " + hours + " ساعة";

    const days =
        Math.floor(hours / 24);

    if(days < 30)
        return "قبل " + days + " يوم";

    return "منذ فترة";

}


/* ==============================
   LOAD STATS
============================== */

async function loadStats(){

    try{

        const response =
            await fetch(
                API_URL + "/stats",
                {
                    method:"GET",
                    credentials:"include"
                }
            );


        if(!response.ok)
            throw new Error("API error");


        const data =
            await response.json();


        total.textContent =
            data.total || 0;

        today.textContent =
            data.today || 0;

        week.textContent =
            data.week || 0;

        month.textContent =
            data.month || 0;


        /* LOGIN STATUS */

        if(data.loggedIn){

            loginStatus.textContent =
                "✓ تم تسجيل الدخول عبر Discord";

            loginBtn.style.display =
                "none";


            if(data.canVote){

                voteBtn.disabled = false;

                message.textContent =
                    "يمكنك التصويت الآن";

            }else{

                voteBtn.disabled = true;

                message.textContent =
                    "✓ أنت مصوّت مسبقًا";

            }

        }else{

            loginStatus.textContent =
                "سجّل الدخول أولاً حتى تتمكن من التصويت";

            loginBtn.style.display =
                "block";

            voteBtn.disabled = true;

        }


        /* PROGRESS */

        const max =
            Math.max(
                Number(data.total || 0),
                1
            );

        const percent =
            Math.min(
                (Number(data.today || 0) / max) * 100,
                100
            );

        progressBar.style.width =
            percent + "%";

        progressText.textContent =
            Math.round(percent) + "%";


        /* RECENT VOTERS */

        voters.innerHTML = "";


        if(
            !data.recent ||
            data.recent.length === 0
        ){

            voters.innerHTML =
                '<div class="loading">لا توجد أصوات حتى الآن</div>';

        }else{

            data.recent.forEach(
                voter => {

                    const row =
                        document.createElement("div");

                    row.className =
                        "voter";


                    const name =
                        document.createElement("div");

                    name.className =
                        "voter-name";


                    const avatar =
                        document.createElement("div");

                    avatar.className =
                        "avatar";

                    avatar.textContent =
                        (voter.username || "?")
                        .charAt(0)
                        .toUpperCase();


                    const username =
                        document.createElement("span");

                    username.className =
                        "name";

                    username.textContent =
                        voter.username ||
                        "Discord User";


                    name.appendChild(avatar);

                    name.appendChild(username);


                    const time =
                        document.createElement("span");

                    time.className =
                        "time";

                    time.textContent =
                        timeAgo(
                            voter.created_at
                        );


                    row.appendChild(name);

                    row.appendChild(time);

                    voters.appendChild(row);

                }
            );

        }


    }catch(error){

        console.error(error);

        loginStatus.textContent =
            "تعذر الاتصال بالخادم";

        voters.innerHTML =
            '<div class="loading">تعذر تحميل البيانات</div>';

    }

}


/* ==============================
   VOTE
============================== */

async function vote(){

    voteBtn.disabled = true;

    message.textContent =
        "جاري تسجيل صوتك...";


    try{

        const response =
            await fetch(
                API_URL + "/vote",
                {
                    method:"POST",
                    credentials:"include"
                }
            );


        const data =
            await response.json();


        if(response.status === 401){

            window.location.href =
                API_URL + "/oauth/login";

            return;

        }


        if(response.status === 409){

            message.textContent =
                "✓ أنت مصوّت مسبقًا";

            await loadStats();

            return;

        }


        if(!response.ok){

            throw new Error(
                data.error ||
                "Vote failed"
            );

        }


        if(data.success){

            message.textContent =
                "✓ تم تسجيل صوتك بنجاح";

            await loadStats();

        }


    }catch(error){

        console.error(error);

        message.textContent =
            "حدث خطأ، حاول مرة أخرى";

        voteBtn.disabled = false;

    }

}


/* ==============================
   START
============================== */

loadStats();


/* تحديث الإحصائيات كل 30 ثانية */

setInterval(
    loadStats,
    30000
);

</script>

</body>
</html>
